<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --teal:#055F56; --navy:#04242F; --blue:#0B376C; --mist:#EAF2F5; --grey:#8A99A3; --red:#B42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:#1F2D33; background:#fff; }
  header { background:var(--navy); border-bottom:4px solid var(--teal); padding:10px 16px;
           display:flex; align-items:center; justify-content:space-between; }
  header .brand { color:#fff; font-weight:700; }
  .lang button { background:transparent; color:#9FD3CB; border:1px solid #9FD3CB; border-radius:999px;
                 padding:4px 12px; margin-left:6px; cursor:pointer; font-size:.85rem; }
  .lang button.on { background:#9FD3CB; color:var(--navy); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  .hero { background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 70%,var(--teal) 100%); color:#fff;
          border-radius:12px; padding:22px 20px; margin-bottom:22px; }
  .hero h1 { margin:0 0 6px; font-size:1.45rem; }
  .hero p { margin:0; color:#dbeeea; }
  label { display:block; font-weight:600; color:var(--navy); margin:14px 0 6px; }
  .hint { color:#5f6f78; font-size:.88rem; margin:4px 0 0; }
  input[type=email], input[type=text] { width:100%; padding:11px 12px; font-size:1rem; border:1.5px solid #c9d6dc;
          border-radius:8px; }
  input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(5,95,86,.15); }
  .check { display:flex; gap:8px; align-items:flex-start; margin-top:14px; font-size:.92rem; }
  .check input { margin-top:3px; }
  button.primary { width:100%; margin-top:18px; padding:12px; font-size:1rem; font-weight:700; color:#fff;
          background:var(--teal); border:none; border-radius:8px; cursor:pointer; }
  button.primary:disabled { opacity:.55; cursor:wait; }
  button.link { background:none; border:none; color:var(--blue); text-decoration:underline; cursor:pointer;
          padding:0; font-size:.9rem; margin-top:10px; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:.95rem; display:none; }
  .msg.ok { display:block; background:var(--mist); border-left:5px solid var(--teal); }
  .msg.err { display:block; background:#FEF3F2; border-left:5px solid var(--red); color:#7A271A; }
  .step { display:none; } .step.on { display:block; }
  .id { font-family:Consolas,monospace; font-weight:700; color:var(--navy); }
  footer { text-align:center; color:var(--grey); font-size:.82rem; padding:16px; border-top:1px solid #e3eaee; }
  footer em { color:var(--teal); }
</style>
</head>
<body>
<header>
  <span class="brand">Neudata Consulting Ltd</span>
  <span class="lang"><button id="b-vi" onclick="setLang('vi')">Tiếng Việt</button><button id="b-en" onclick="setLang('en')">English</button></span>
</header>
<main>
  <div class="hero"><h1 data-t="title"></h1><p data-t="course"></p></div>

  <!-- Step 1: email -->
  <section class="step on" id="step1">
    <p data-t="intro1"></p>
    <label for="email" data-t="emailLabel"></label>
    <input id="email" type="email" autocomplete="email" placeholder="name@gmail.com">
    <p class="hint" data-t="emailHint"></p>
    <button class="primary" id="send" onclick="sendCode()" data-t="sendCode"></button>
  </section>

  <!-- Step 2: code + official name -->
  <section class="step" id="step2">
    <p data-t="intro2"></p>
    <label for="code" data-t="codeLabel"></label>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
    <label for="name" data-t="nameLabel"></label>
    <input id="name" type="text" autocomplete="name">
    <p class="hint" data-t="nameHint"></p>
    <div class="check"><input id="confirm" type="checkbox"><label for="confirm" style="margin:0;font-weight:400" data-t="confirm"></label></div>
    <button class="primary" id="gen" onclick="generate()" data-t="generate"></button>
    <button class="link" onclick="back()" data-t="back"></button>
  </section>

  <div class="msg" id="msg"></div>
</main>
<footer>Neudata Consulting Ltd · <em>Insight. Impact. Innovation.</em> · www.neu-data.com</footer>

<script>
const T = {
  en: {
    title: "Get your certificate",
    course: "Clinical Data Analysis in R — Phase I",
    intro1: "Enter the email address you registered with. We will check it against the list of participants who completed the course and send you a 6-digit login code.",
    emailLabel: "Your email address",
    emailHint: "Use the same email you used to register for the course.",
    sendCode: "Send me a login code",
    intro2: "We have emailed you a 6-digit code. Enter it below with your official name.",
    codeLabel: "Login code (from your email)",
    nameLabel: "Your official full name",
    nameHint: "Exactly as it should appear on your certificate — check spelling, accents and order. It cannot be changed afterwards.",
    confirm: "I confirm my name is spelled correctly.",
    generate: "Generate my certificate",
    back: "← Use a different email",
    working: "Please wait…",
    CODE_SENT: "A login code has been sent to your email. Check your inbox (and spam folder).",
    CODE_ALREADY_SENT: "A code was sent less than a minute ago. Check your inbox, or try again shortly.",
    NOT_ELIGIBLE: "This email is not on our list of participants who completed the course. Check the address, or contact contact@neu-data.com.",
    BAD_EMAIL: "Please enter a valid email address.",
    BAD_NAME: "Please enter your full official name (first and last name, letters only).",
    BAD_CODE: "That code is incorrect or has expired. Go back and request a new one.",
    NEED_CONFIRM: "Please tick the box to confirm your name is spelled correctly.",
    SENT: "Done! Your certificate {id} has been sent to {email}. A copy is kept by Neudata.",
    RESENT: "You already have certificate {id}. We have sent it again to {email}.",
    RECENTLY_SENT: "Your certificate {id} was sent to {email} a few minutes ago. Please check your inbox.",
    ERROR: "Something went wrong. Please try again later or contact contact@neu-data.com.",
  },
  vi: {
    title: "Nhận chứng nhận của bạn",
    course: "Phân tích Dữ liệu Lâm sàng bằng R — Giai đoạn I",
    intro1: "Nhập địa chỉ email bạn đã dùng để đăng ký. Chúng tôi sẽ kiểm tra email trong danh sách học viên đã hoàn thành khóa học và gửi cho bạn mã đăng nhập gồm 6 chữ số.",
    emailLabel: "Địa chỉ email của bạn",
    emailHint: "Dùng đúng email bạn đã đăng ký khóa học.",
    sendCode: "Gửi mã đăng nhập cho tôi",
    intro2: "Chúng tôi đã gửi mã 6 chữ số đến email của bạn. Nhập mã cùng họ tên chính thức của bạn bên dưới.",
    codeLabel: "Mã đăng nhập (trong email)",
    nameLabel: "Họ và tên chính thức",
    nameHint: "Đúng như cần in trên chứng nhận — kiểm tra chính tả, dấu và thứ tự. Không thể thay đổi sau khi tạo.",
    confirm: "Tôi xác nhận họ tên của tôi được viết đúng.",
    generate: "Tạo chứng nhận của tôi",
    back: "← Dùng email khác",
    working: "Vui lòng chờ…",
    CODE_SENT: "Mã đăng nhập đã được gửi đến email của bạn. Vui lòng kiểm tra hộp thư (và thư rác).",
    CODE_ALREADY_SENT: "Mã vừa được gửi chưa đầy một phút trước. Vui lòng kiểm tra hộp thư hoặc thử lại sau.",
    NOT_ELIGIBLE: "Email này không có trong danh sách học viên đã hoàn thành khóa học. Vui lòng kiểm tra lại địa chỉ hoặc liên hệ contact@neu-data.com.",
    BAD_EMAIL: "Vui lòng nhập địa chỉ email hợp lệ.",
    BAD_NAME: "Vui lòng nhập đầy đủ họ tên chính thức (họ và tên, chỉ gồm chữ cái).",
    BAD_CODE: "Mã không đúng hoặc đã hết hạn. Vui lòng quay lại và yêu cầu mã mới.",
    NEED_CONFIRM: "Vui lòng đánh dấu xác nhận họ tên của bạn được viết đúng.",
    SENT: "Hoàn tất! Chứng nhận {id} đã được gửi đến {email}. Neudata lưu giữ một bản sao.",
    RESENT: "Bạn đã có chứng nhận {id}. Chúng tôi đã gửi lại đến {email}.",
    RECENTLY_SENT: "Chứng nhận {id} đã được gửi đến {email} vài phút trước. Vui lòng kiểm tra hộp thư.",
    ERROR: "Đã xảy ra lỗi. Vui lòng thử lại sau hoặc liên hệ contact@neu-data.com.",
  },
};
// Language: ?lang= from the course site wins, then the visitor's saved choice, then the browser.
const fromSite = "<?= lang ?>";
let lang = (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en";
try { lang = localStorage.getItem("neudata-course-lang") || lang; } catch (e) {}
if (fromSite === "vi" || fromSite === "en") lang = fromSite;

function setLang(l) {
  lang = l;
  try { localStorage.setItem("neudata-course-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[l][el.dataset.t]; });
  document.getElementById("b-vi").classList.toggle("on", l === "vi");
  document.getElementById("b-en").classList.toggle("on", l === "en");
}
function show(kind, key, vars) {
  let s = T[lang][key] || T[lang].ERROR;
  Object.entries(vars || {}).forEach(([k, v]) => { s = s.replace("{" + k + "}", v); });
  const m = document.getElementById("msg");
  m.className = "msg " + kind;
  m.innerHTML = "";
  m.textContent = s;
}
function busy(btn, on) { btn.disabled = on; btn.textContent = on ? T[lang].working : T[lang][btn.dataset.t]; }
function step(n) {
  document.getElementById("step1").classList.toggle("on", n === 1);
  document.getElementById("step2").classList.toggle("on", n === 2);
}
function sendCode() {
  const btn = document.getElementById("send");
  const email = document.getElementById("email").value.trim();
  busy(btn, true);
  google.script.run
    .withSuccessHandler(r => {
      busy(btn, false);
      if (r.ok) { show("ok", r.code); step(2); document.getElementById("code").focus(); }
      else show("err", r.code);
    })
    .withFailureHandler(() => { busy(btn, false); show("err", "ERROR"); })
    .requestCode(email, lang);
}
function generate() {
  if (!document.getElementById("confirm").checked) { show("err", "NEED_CONFIRM"); return; }
  const btn = document.getElementById("gen");
  busy(btn, true);
  google.script.run
    .withSuccessHandler(r => {
      busy(btn, false);
      if (r.ok) { show("ok", r.code, { id: r.id, email: r.email }); btn.disabled = true; }
      else show("err", r.code);
    })
    .withFailureHandler(() => { busy(btn, false); show("err", "ERROR"); })
    .generateCertificate(
      document.getElementById("email").value.trim(),
      document.getElementById("name").value,
      document.getElementById("code").value,
      lang);
}
function back() { step(1); document.getElementById("msg").className = "msg"; }
setLang(lang);
</script>
</body>
</html>
