<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --teal:#055F56; --navy:#04242F; --blue:#0B376C; --mist:#EAF2F5; --grey:#8A99A3; --red:#B42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:#1F2D33; background:#fff; }
  header { background:var(--navy); border-bottom:4px solid var(--teal); padding:10px 16px;
           display:flex; align-items:center; justify-content:space-between; }
  header .brand { color:#fff; font-weight:700; }
  .lang button { background:transparent; color:#9FD3CB; border:1px solid #9FD3CB; border-radius:999px;
                 padding:4px 12px; margin-left:6px; cursor:pointer; font-size:.85rem; }
  .lang button.on { background:#9FD3CB; color:var(--navy); }
  main { max-width:600px; margin:0 auto; padding:24px 16px 40px; }
  .hero { background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 70%,var(--teal) 100%); color:#fff;
          border-radius:12px; padding:22px 20px; margin-bottom:22px; }
  .hero h1 { margin:0 0 6px; font-size:1.45rem; }
  .hero p { margin:0; color:#dbeeea; }
  label { display:block; font-weight:600; color:var(--navy); margin:14px 0 6px; }
  .hint { color:#5f6f78; font-size:.88rem; margin:4px 0 0; }
  input[type=email], input[type=text], textarea { width:100%; padding:11px 12px; font-size:1rem;
          border:1.5px solid #c9d6dc; border-radius:8px; font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  input:focus, textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(5,95,86,.15); }
  .drop { border:2px dashed #b9cbd2; border-radius:10px; padding:18px; text-align:center; background:#fafcfd; }
  .drop.has { border-color:var(--teal); background:var(--mist); }
  .drop input { margin-top:8px; }
  .check { display:flex; gap:8px; align-items:flex-start; margin-top:14px; font-size:.92rem; }
  .check input { margin-top:3px; }
  button.primary { width:100%; margin-top:18px; padding:13px; font-size:1.05rem; font-weight:700; color:#fff;
          background:var(--teal); border:none; border-radius:8px; cursor:pointer; }
  button.primary:disabled { opacity:.55; cursor:wait; }
  button.secondary { width:100%; margin-top:10px; padding:11px; font-size:1rem; font-weight:600; color:var(--teal);
          background:#fff; border:1.5px solid var(--teal); border-radius:8px; cursor:pointer; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:.95rem; display:none; }
  .msg.err { display:block; background:#FEF3F2; border-left:5px solid var(--red); color:#7A271A; }
  .msg.ok { display:block; background:var(--mist); border-left:5px solid var(--teal); }
  .done { display:none; text-align:center; padding:8px 0; }
  .done.on { display:block; }
  .done .tick { width:56px; height:56px; border-radius:50%; background:var(--teal); color:#fff; font-size:30px;
          line-height:56px; margin:6px auto 12px; }
  .done h2 { color:var(--navy); margin:0 0 8px; font-size:1.25rem; }
  .id { font-family:Consolas,monospace; font-weight:700; color:var(--navy); }
  footer { text-align:center; color:var(--grey); font-size:.82rem; padding:16px; border-top:1px solid #e3eaee; }
  footer em { color:var(--teal); }
</style>
</head>
<body>
<header>
  <span class="brand">Neudata Consulting Ltd</span>
  <span class="lang"><button id="b-vi" onclick="setLang('vi')">Tiếng Việt</button><button id="b-en" onclick="setLang('en')">English</button></span>
</header>
<main>
  <div class="hero"><h1 data-t="title"></h1><p data-t="course"></p></div>

  <form id="f" onsubmit="send(event)">
    <p data-t="intro"></p>
    <input type="hidden" name="lang" id="lang">
    <label for="name" data-t="nameLabel"></label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <label for="email" data-t="emailLabel"></label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="name@gmail.com" required>
    <p class="hint" data-t="emailHint"></p>
    <label for="file" data-t="fileLabel"></label>
    <div class="drop" id="drop">
      <div data-t="fileHint"></div>
      <input id="file" name="file" type="file" accept="<?= types ?>" required onchange="picked()">
    </div>
    <label for="note" data-t="noteLabel"></label>
    <textarea id="note" name="note"></textarea>
    <div class="check"><input id="own" name="own" type="checkbox" value="yes">
      <label for="own" style="margin:0;font-weight:400" data-t="own"></label></div>
    <button class="primary" id="go" type="submit" data-t="submit"></button>
  </form>

  <section class="done" id="done">
    <div class="tick">&#10003;</div>
    <h2 data-t="doneTitle"></h2>
    <p id="doneText"></p>
    <button class="secondary" type="button" onclick="again()" data-t="again"></button>
  </section>

  <div class="msg" id="msg"></div>
</main>
<footer>Neudata Consulting Ltd · <em>Insight. Impact. Innovation.</em> · www.neu-data.com</footer>

<script>
const MAXMB = Number("<?= maxMB ?>");
const T = {
  en: {
    title: "Submit your final assignment",
    course: "Clinical Data Analysis in R — Phase I",
    intro: "Upload your final assignment here. It is sent directly to the lead trainer, Vương Mỹ Lượng, and you will receive a confirmation email with a submission number.",
    nameLabel: "Your full name",
    emailLabel: "Your email address",
    emailHint: "Use the email you registered with — your confirmation and the trainer's feedback go here.",
    fileLabel: "Your assignment file",
    fileHint: "Preferably one .zip file named Surname_Phase1_Assignment.zip (script or Quarto file, Table 1, figures and Results section). Maximum " + MAXMB + " MB.",
    noteLabel: "Message to the trainer (optional)",
    own: "I confirm this is my own work, completed individually.",
    submit: "Submit",
    sending: "Uploading and sending… please wait",
    doneTitle: "Your assignment has been submitted",
    done: "Thank you, {name}. Your submission number is {id}. A confirmation has been sent to {email}.",
    again: "Submit another file",
    BAD_NAME: "Please enter your full name (first and last name).",
    BAD_EMAIL: "Please enter a valid email address.",
    NO_FILE: "Please choose your assignment file.",
    BAD_TYPE: "This file type is not accepted. Please upload a .zip (or .R, .qmd, .Rmd, .html, .pdf, .docx).",
    TOO_BIG: "The file is larger than " + MAXMB + " MB. Please reduce it (e.g. lower-resolution figures) or contact the trainer.",
    NEED_CONFIRM: "Please tick the box to confirm this is your own work.",
    TOO_SOON: "You submitted less than a minute ago. Please wait a moment before submitting again.",
    ERROR: "Something went wrong. Please try again, or email your file to myluong1710@gmail.com.",
  },
  vi: {
    title: "Nộp bài tập cuối khóa",
    course: "Phân tích Dữ liệu Lâm sàng bằng R — Giai đoạn I",
    intro: "Tải bài tập cuối khóa của bạn lên tại đây. Bài sẽ được gửi trực tiếp đến giảng viên chính Vương Mỹ Lượng, và bạn sẽ nhận email xác nhận kèm mã bài nộp.",
    nameLabel: "Họ và tên",
    emailLabel: "Địa chỉ email",
    emailHint: "Dùng email bạn đã đăng ký — email xác nhận và nhận xét của giảng viên sẽ được gửi đến đây.",
    fileLabel: "Tệp bài tập",
    fileHint: "Tốt nhất là một tệp .zip tên Surname_Phase1_Assignment.zip (script hoặc tệp Quarto, Bảng 1, các hình và phần Kết quả). Tối đa " + MAXMB + " MB.",
    noteLabel: "Lời nhắn cho giảng viên (không bắt buộc)",
    own: "Tôi xác nhận đây là bài làm của riêng tôi, được hoàn thành độc lập.",
    submit: "Nộp bài",
    sending: "Đang tải lên và gửi… vui lòng chờ",
    doneTitle: "Bài tập của bạn đã được nộp",
    done: "Cảm ơn {name}. Mã bài nộp của bạn là {id}. Email xác nhận đã được gửi đến {email}.",
    again: "Nộp tệp khác",
    BAD_NAME: "Vui lòng nhập đầy đủ họ và tên.",
    BAD_EMAIL: "Vui lòng nhập địa chỉ email hợp lệ.",
    NO_FILE: "Vui lòng chọn tệp bài tập.",
    BAD_TYPE: "Loại tệp này không được chấp nhận. Vui lòng tải lên tệp .zip (hoặc .R, .qmd, .Rmd, .html, .pdf, .docx).",
    TOO_BIG: "Tệp lớn hơn " + MAXMB + " MB. Vui lòng giảm dung lượng (ví dụ hình có độ phân giải thấp hơn) hoặc liên hệ giảng viên.",
    NEED_CONFIRM: "Vui lòng đánh dấu xác nhận đây là bài làm của riêng bạn.",
    TOO_SOON: "Bạn vừa nộp chưa đầy một phút trước. Vui lòng chờ một lát trước khi nộp lại.",
    ERROR: "Đã xảy ra lỗi. Vui lòng thử lại, hoặc gửi tệp qua email đến myluong1710@gmail.com.",
  },
};
const fromSite = "<?= lang ?>";
let lang = (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en";
try { lang = localStorage.getItem("neudata-course-lang") || lang; } catch (e) {}
if (fromSite === "vi" || fromSite === "en") lang = fromSite;

function setLang(l) {
  lang = l;
  try { localStorage.setItem("neudata-course-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.getElementById("lang").value = l;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[l][el.dataset.t]; });
  document.getElementById("b-vi").classList.toggle("on", l === "vi");
  document.getElementById("b-en").classList.toggle("on", l === "en");
}
function show(key) {
  const m = document.getElementById("msg");
  m.className = "msg err";
  m.textContent = T[lang][key] || T[lang].ERROR;
}
function picked() {
  const f = document.getElementById("file").files[0];
  document.getElementById("drop").classList.toggle("has", !!f);
  if (f && f.size > MAXMB * 1024 * 1024) show("TOO_BIG"); else document.getElementById("msg").className = "msg";
}
function send(ev) {
  ev.preventDefault();
  const f = document.getElementById("file").files[0];
  if (!f) return show("NO_FILE");
  if (f.size > MAXMB * 1024 * 1024) return show("TOO_BIG");
  if (!document.getElementById("own").checked) return show("NEED_CONFIRM");
  const btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = T[lang].sending;
  document.getElementById("msg").className = "msg";
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false; btn.textContent = T[lang].submit;
      if (!r.ok) return show(r.code);
      document.getElementById("doneText").textContent = T[lang].done
        .replace("{name}", document.getElementById("name").value.trim())
        .replace("{id}", r.id).replace("{email}", document.getElementById("email").value.trim());
      document.getElementById("f").style.display = "none";
      document.getElementById("done").classList.add("on");
    })
    .withFailureHandler(() => { btn.disabled = false; btn.textContent = T[lang].submit; show("ERROR"); })
    .submitAssignment(document.getElementById("f"));
}
function again() {
  document.getElementById("file").value = "";
  document.getElementById("note").value = "";
  document.getElementById("own").checked = false;
  document.getElementById("drop").classList.remove("has");
  document.getElementById("done").classList.remove("on");
  document.getElementById("f").style.display = "";
}
setLang(lang);
</script>
</body>
</html>
